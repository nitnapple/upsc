<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Practice Test - Indian Economic Development</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        .timer-animation {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .option-label {
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
        .option-label.selected {
            background-color: #eff6ff; /* blue-50 */
            border-color: #3b82f6; /* blue-500 */
        }
        .explanation, .hint-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out, margin 0.5s ease-out;
            padding: 0 1rem;
            margin-top: 0;
        }
        .explanation.show, .hint-box.show {
            max-height: 1000px;
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
        }
        
        /* --- Palette & Button Styles --- */
        .palette-btn {
            width: 2.25rem; height: 2.25rem;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 9999px; font-size: 0.875rem; font-weight: 600;
            transition: all 0.2s ease-in-out; flex-shrink: 0;
        }
        .palette-unanswered { border: 1px solid #9ca3af; color: #4b5563; }
        .palette-unanswered:hover { background-color: #f3f4f6; }
        .palette-answered { background-color: #3b82f6; color: white; } /* Blue */
        .palette-answered:hover { background-color: #2563eb; }
        .palette-marked { background-color: #8b5cf6; color: white; } /* Violet */
        .palette-marked:hover { background-color: #7c3aed; }
        .palette-answered-marked { background-color: #8b5cf6; color: white; position: relative; }
        .palette-answered-marked::after {
            content: ''; position: absolute; bottom: 4px; right: 4px;
            width: 6px; height: 6px; border-radius: 50%; background-color: white;
        }
        .palette-current {
            background-color: #111827; color: white; transform: scale(1.1);
            border: 2px solid #6b7280;
        }

        /* --- Custom Scrollbar for Palette --- */
        #question-palette::-webkit-scrollbar { height: 8px; }
        #question-palette::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        #question-palette::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #question-palette::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* --- Smooth Transition for Questions --- */
        #question-content-wrapper {
            transition: opacity 0.15s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="main-container" class="container mx-auto p-4 sm:p-6 md:p-8 max-w-5xl">
        <div id="test-area" class="bg-white p-4 sm:p-6 rounded-2xl shadow-lg border border-gray-200 min-h-[80vh]">
            <!-- Views will be rendered here -->
        </div>
    </div>
    
    <!-- Modal for confirmation -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl text-center max-w-sm mx-4">
            <h3 class="text-xl font-bold mb-4 text-gray-900">Are you sure?</h3>
            <p class="text-gray-600 mb-6">Do you really want to end and submit the test?</p>
            <div class="flex justify-center space-x-4">
                <button id="modal-cancel-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-6 rounded-lg hover:bg-gray-300">Cancel</button>
                <button id="modal-confirm-btn" class="bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700">End Test</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const TestApp = {
                
                state: {
                    currentView: 'start',
                    currentQuestionIndex: 0,
                    userAnswers: [],
                    markedForReview: [],
                    timeRemaining: 3600,
                    timerInterval: null,
                    questions: [
                        { question: "According to Victor Alexander Bruce, the Viceroy in 1894, what was the significance of India to the British Empire?", hint: "Recall the quote about the 'sun' of the Empire.", options: ["A minor territory with limited resources", "A strategic military outpost", "The pivot of the Empire, without which it would collapse", "A partner in trade and governance"], correct: 2, chapter: 1, page: 4, explanation: "The quote at the beginning of the chapter explicitly states, '...if we lose India, the sun of our Empire will have set', highlighting its central importance." },
                        { question: "What was the primary objective of the economic policies pursued by the colonial government in India?", hint: "Whose economic interests were being protected and promoted?", options: ["To modernize the Indian economy", "To promote the welfare of the Indian people", "To protect and promote the economic interests of Britain", "To create a self-sufficient Indian economy"], correct: 2, chapter: 1, page: 5, explanation: "The text states that colonial policies 'were concerned more with the protection and promotion of the economic interests of their home country than with the development of the Indian economy'." },
                        { question: "Before British rule, India was particularly well known for which type of industries?", hint: "Think about traditional, pre-industrial revolution manufacturing.", options: ["Heavy machinery and capital goods", "Software and information technology", "Handicraft industries like cotton and silk textiles", "Automobile manufacturing"], correct: 2, chapter: 1, page: 4, explanation: "India was renowned for its handicraft industries in fields of cotton and silk textiles, metal, and precious stone works, which enjoyed a worldwide market." },
                        { question: "What was 'Daccai Muslin'?", hint: "It was a famous textile from a city now a capital in Bangladesh.", options: ["A type of woollen shawl from Kashmir", "An exquisite type of cotton textile from Bengal", "A metal alloy used in making utensils", "A variety of indigo dye"], correct: 1, chapter: 1, page: 4, explanation: "'Daccai Muslin', originating from Bengal (around present-day Dhaka), had gained worldwide fame as an exquisite type of cotton textile." },
                        { question: "Among the estimators of India's national income during the colonial period, whose estimates were considered 'very significant'?", hint: "His initials are V.K.R.V.", options: ["Dadabhai Naoroji", "Findlay Shirras", "William Digby", "V.K.R.V. Rao"], correct: 3, chapter: 1, page: 5, explanation: "The text explicitly mentions, 'it was Rao, whose estimates during the colonial period was considered very significant.'" },
                        { question: "What was the approximate growth of aggregate real output during the first half of the twentieth century in India?", hint: "The growth was positive but very low.", options: ["Less than two per cent", "Around five per cent", "More than ten per cent", "The growth was stagnant at zero per cent"], correct: 0, chapter: 1, page: 5, explanation: "Most studies found that the country's growth of aggregate real output during this period 'was less than two per cent'." },
                        { question: "What percentage of India's population lived in villages and derived their livelihood from agriculture under British rule?", hint: "A very large majority of the population was agrarian.", options: ["About 50 per cent", "About 65 per cent", "About 85 per cent", "Over 95 per cent"], correct: 2, chapter: 1, page: 5, explanation: "The text states that under British colonial rule, India's economy remained fundamentally agrarian with 'about 85 per cent of the country's population' living in villages and depending on agriculture." },
                        { question: "Which land settlement system, implemented in the Bengal Presidency, was a major cause of agricultural stagnation?", hint: "This system involved intermediaries collecting rent.", options: ["Ryotwari System", "Mahalwari System", "Zamindari System", "Taluqdari System"], correct: 2, chapter: 1, page: 6, explanation: "The stagnation was caused mainly by various land settlement systems, 'Particularly, under the zamindari system which was implemented in the then Bengal Presidency'." },
                        { question: "Under the zamindari system, what was the main interest of the zamindars?", hint: "Their focus was on revenue, not agricultural improvement.", options: ["To improve the condition of agriculture", "To invest in new farming technologies", "To provide financial support to cultivators", "To collect rent regardless of the cultivators' economic condition"], correct: 3, chapter: 1, page: 6, explanation: "The main interest of the zamindars was 'only to collect rent regardless of the economic condition of the cultivators'." },
                        { question: "What does the term 'commercialisation of agriculture' during the colonial period refer to?", hint: "It involves a shift from growing food for self-consumption.", options: ["The shift from subsistence farming to growing crops for the market", "The use of modern technology in agriculture", "The government taking over all agricultural land", "A focus on growing food crops for domestic consumption"], correct: 0, chapter: 1, page: 6, explanation: "It refers to the shift in cropping patterns where farmers started producing cash crops like cotton or indigo, which were to be ultimately used by British industries, instead of food crops." },
                        { question: "Consider the following statements regarding the industrial sector during British rule:", hint: "One statement incorrectly suggests rapid replacement of old industries.", statements: ["The world-famous handicraft industries declined.", "A corresponding modern industrial base was rapidly set up to replace handicrafts.", "The policy of systematically de-industrialising India was a primary objective of the colonial government."], options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], correct: 2, chapter: 1, page: 7, explanation: "Statement 2 is incorrect. While handicrafts declined, 'no corresponding modern industrial base was allowed to come up'. Statements 1 and 3 are correct descriptions of the colonial policy." },
                        { question: "What was the two-fold motive behind the policy of de-industrialisation?", hint: "It related to both sourcing materials and selling finished products.", statements: ["To make India an exporter of raw materials for Britain.", "To turn India into a market for British finished goods.", "To encourage Indian entrepreneurs to set up competing industries."], options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], correct: 0, chapter: 1, page: 7, explanation: "Statement 3 is incorrect. The motive was to eliminate competition. The intention was to 'reduce India to the status of a mere exporter of important raw materials' and 'turn India into a sprawling market for the finished products'." },
                        { question: "Modern industry began to take root in India during the second half of which century?", hint: "This was the century of British industrial dominance.", options: ["Seventeenth century", "Eighteenth century", "Nineteenth century", "Twentieth century"], correct: 2, chapter: 1, page: 7, explanation: "The text states, 'During the second half of the nineteenth century, modern industry began to take root in India but its progress remained very slow.'" },
                        { question: "The early cotton textile mills were mainly located in which parts of India?", hint: "These western states are still known for their textile industry.", options: ["Bengal and Bihar", "Punjab and Haryana", "Maharashtra and Gujarat", "Madras Presidency"], correct: 2, chapter: 1, page: 7, explanation: "The cotton textile mills were located in the western parts of the country, namely, Maharashtra and Gujarat." },
                        { question: "Jute mills established during the colonial period were mainly concentrated in which region?", hint: "This eastern region was the center of jute production.", options: ["Bombay", "Madras", "Bengal", "United Provinces"], correct: 2, chapter: 1, page: 7, explanation: "The jute mills, dominated by foreigners, were mainly concentrated in Bengal." },
                        { question: "The Tata Iron and Steel Company (TISCO) was incorporated in which year?", hint: "This happened in the early 1900s.", options: ["1850", "1881", "1907", "1921"], correct: 2, chapter: 1, page: 7, explanation: "The Tata Iron and Steel Company (TISCO) was incorporated in 1907, marking a key development in the Indian steel industry." },
                        { question: "What is a 'capital goods industry'?", hint: "This type of industry produces things that make other things.", options: ["An industry producing consumer goods like textiles and sugar.", "An industry producing machine tools used for further production.", "An industry that requires a large amount of financial capital.", "An industry owned and operated by the government."], correct: 1, chapter: 1, page: 7, explanation: "The text defines it as 'industries which can produce machine tools which are, in turn, used for producing articles for current consumption.' Colonial India had hardly any such industry." },
                        { question: "The public sector during the colonial era was confined to which areas?", hint: "Think about large-scale infrastructure and communication networks.", statements: ["Railways and power generation", "Communications and ports", "Textile and steel production"], options: ["1 only", "1 and 2 only", "2 and 3 only", "1, 2 and 3"], correct: 1, chapter: 1, page: 8, explanation: "Statement 3 is incorrect. Major manufacturing sectors like textile and steel were in the private sector. The public sector 'remained confined only to the railways, power generation, communications, ports and some other departmental undertakings.'" },
                        { question: "How did colonial policies affect the structure of India's foreign trade?", hint: "India's role changed from producer to supplier of basic materials.", options: ["India became an exporter of finished goods and importer of raw materials.", "India's trade was diversified with many countries globally.", "India became an exporter of primary products and importer of finished goods.", "India achieved a balanced trade with Britain."], correct: 2, chapter: 1, page: 8, explanation: "The restrictive policies led to India becoming an 'exporter of primary products such as raw silk, cotton, wool... and an importer of finished consumer goods like cotton, silk and woollen clothes'." },
                        { question: "Which country maintained a monopoly control over India's exports and imports during the colonial period?", hint: "The colonial ruler held this control.", options: ["France", "Portugal", "Germany", "Britain"], correct: 3, chapter: 1, page: 8, explanation: "The text clearly states, 'For all practical purposes, Britain maintained a monopoly control over India’s exports and imports.'" },
                        { question: "The opening of which canal in 1869 intensified British control over India's foreign trade?", hint: "This artificial waterway connects the Mediterranean to the Red Sea.", options: ["Panama Canal", "Erie Canal", "Suez Canal", "Kiel Canal"], correct: 2, chapter: 1, page: 8, explanation: "The opening of the Suez Canal provided a direct and faster trade route, which 'further intensified British control over India’s foreign trade'." },
                        { question: "What was the most important characteristic of India's foreign trade throughout the colonial period?", hint: "India sold more than it bought, but didn't reap the benefits.", options: ["Generation of a large import surplus", "Generation of a large export surplus", "Trade focused only on agricultural goods", "Equal balance of payments"], correct: 1, chapter: 1, page: 8, explanation: "The most important characteristic of India's foreign trade throughout the colonial period was the generation of a large export surplus." },
                        { question: "How did the large export surplus benefit the Indian economy?", hint: "The surplus was used for colonial expenses, not India's development.", options: ["It led to a massive flow of gold and silver into India.", "It was used to fund infrastructure and welfare projects in India.", "It did not result in any significant benefit as it was used to pay for British expenses.", "It was used to reduce taxes on the Indian population."], correct: 2, chapter: 1, page: 9, explanation: "The surplus came at a huge cost and did not benefit India. It 'did not result in any flow of gold or silver into India. Rather, this was used to make payments for the expenses incurred by an office set up by the colonial government in Britain...'" },
                        { question: "The phenomenon where India's export surplus was used to fund British administrative and war expenses is known as:", hint: "This term describes the siphoning of a country's wealth.", options: ["Economic integration", "Capital flight", "Drain of Indian wealth", "Mercantilism"], correct: 2, chapter: 1, page: 9, explanation: "This process, where the surplus was used to pay for Britain's expenses, 'led to the drain of Indian wealth.'" },
                        { question: "When was the first official census operation undertaken in British India?", hint: "It happened in the latter part of the 19th century.", options: ["1850", "1881", "1901", "1921"], correct: 1, chapter: 1, page: 9, explanation: "Various details about the population of British India were first collected through a census in 1881." },
                        { question: "The year 1921 is known as the 'year of the great divide' in India's demographic history. Why?", hint: "It marks a significant shift in population growth trends.", statements: ["Before 1921, India was in the first stage of demographic transition with high birth and death rates.", "After 1921, the second stage began with declining death rates but high birth rates, leading to population growth.", "In 1921, the population of India recorded a negative growth rate for the first time."], options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], correct: 0, chapter: 1, page: 10, explanation: "Statement 3 is not explicitly mentioned as the reason for the 'divide', although population fluctuations did occur. The primary reason is the transition from the first stage (high birth/death rates) to the second stage (high birth/declining death rates), marking a shift in the demographic pattern." },
                        { question: "What was the overall literacy level in India during the colonial period?", hint: "The figure was very low, in the teens.", options: ["More than 50 per cent", "Around 30 per cent", "Less than 16 per cent", "About 25 per cent"], correct: 2, chapter: 1, page: 10, explanation: "The social development indicators were poor. 'The overall literacy level was less than 16 per cent.'" },
                        { question: "What was the approximate female literacy level in colonial India?", hint: "It was a single-digit percentage.", options: ["About seven per cent", "About fifteen per cent", "About twenty per cent", "About one per cent"], correct: 0, chapter: 1, page: 10, explanation: "Out of the low overall literacy, 'the female literacy level was at a negligible low of about seven per cent.'" },
                        { question: "What was the infant mortality rate in British India, highlighting the poor public health facilities?", hint: "The rate was alarmingly high, over 200 per thousand.", options: ["About 44 per thousand", "About 110 per thousand", "About 218 per thousand", "About 300 per thousand"], correct: 2, chapter: 1, page: 10, explanation: "The infant mortality rate was 'quite alarming—about 218 per thousand in contrast to the present infant mortality rate'." },
                        { question: "What was the average life expectancy in colonial India?", hint: "It was shockingly low, in the early 30s.", options: ["69 years", "55 years", "44 years", "32 years"], correct: 3, chapter: 1, page: 10, explanation: "Life expectancy was 'very low—32 years in contrast to the present 69 years.'" },
                        { question: "The occupational structure of colonial India was characterized by:", hint: "Agriculture dominated, while other sectors were small.", statements: ["A vast majority of the workforce (70-75%) was in the agricultural sector.", "The manufacturing and service sectors each accounted for about 30% of the workforce.", "There was a significant and uniform shift of the workforce from agriculture to industry across all regions."], options: ["1 only", "1 and 2 only", "2 and 3 only", "1, 2 and 3"], correct: 0, chapter: 1, page: 11, explanation: "Statement 1 is correct. Statements 2 and 3 are incorrect. Manufacturing was only 10% and services 15-20%. The shift was not uniform; in fact, some regions saw an increase in agricultural dependence." },
                        { question: "In which of the following regions was there a decline in the dependence of the workforce on the agricultural sector?", hint: "These were major presidencies with port cities.", options: ["Orissa, Rajasthan, and Punjab", "Madras Presidency, Bombay, and Bengal", "Central Provinces and Berar", "United Provinces"], correct: 1, chapter: 1, page: 11, explanation: "Parts of the then Madras Presidency, Bombay and Bengal witnessed a decline in the dependence of the workforce on the agricultural sector." },
                        { question: "What was the real motive behind the development of infrastructure like railways by the British?", hint: "The development served the needs of the rulers, not the ruled.", options: ["To provide basic amenities to the people", "To foster a sense of national unity", "To subserve various colonial interests", "To promote tourism in India"], correct: 2, chapter: 1, page: 11, explanation: "The real motive 'was not to provide basic amenities to the people but to subserve various colonial interests' such as mobilizing the army and transporting raw materials." },
                        { question: "The roads built by the British primarily served the purpose of:", hint: "Their purpose was strategic and economic for the colonial power.", options: ["Connecting all villages to major cities", "Mobilising the army and drawing out raw materials", "Facilitating pilgrimage and cultural travel", "Creating employment for the rural poor"], correct: 1, chapter: 1, page: 11, explanation: "The roads primarily served 'the purposes of mobilising the army within India and drawing out raw materials from the countryside'." },
                        { question: "The introduction of railways in 1850 is considered a significant contribution. What was one of its adverse effects on the Indian economy?", hint: "It impacted the traditional economic structure of villages.", options: ["It made long-distance travel difficult and expensive.", "It hindered the transport of goods across the country.", "It adversely affected the self-sufficiency of village economies.", "It led to the decline of major port cities."], correct: 2, chapter: 1, page: 11, explanation: "While it had social benefits, it 'fostered commercialisation of Indian agriculture which adversely affected the self-sufficiency of the village economies in India'." },
                        { question: "The social benefits of the railways were outweighed by what?", hint: "The country paid a high price for this infrastructure.", options: ["The social conflicts it created", "The country's huge economic loss", "The environmental damage it caused", "The high cost of tickets for Indians"], correct: 1, chapter: 1, page: 12, explanation: "The text concludes that 'The social benefits...were thus outweighed by the country's huge economic loss.'" },
                        { question: "What was the state of inland waterways during the colonial period?", hint: "They struggled against the new railway network.", options: ["They were highly developed and economical.", "They were often uneconomical and failed to compete with railways.", "They were the primary mode of transport for the British army.", "They connected all major rivers in India."], correct: 1, chapter: 1, page: 12, explanation: "These measures were far from satisfactory. The text gives the example of the Coast Canal on the Orissa coast which 'proved uneconomical... and had to be ultimately abandoned.'" },
                        { question: "The introduction of the electric telegraph primarily served the purpose of:", hint: "It was a tool for colonial administration and control.", options: ["Providing communication for the general public", "Promoting business and trade", "Maintaining law and order", "Educating the rural population"], correct: 2, chapter: 1, page: 12, explanation: "The introduction of the expensive system of electric telegraph in India, similarly, 'served the purpose of maintaining law and order.'" },
                        { question: "By the time of independence, the agricultural sector was characterized by:", hint: "It had too many workers for its level of output.", statements: ["High productivity due to technological advancements.", "Surplus labour and extremely low productivity.", "A diversified cropping pattern that ensured food security."], options: ["1 only", "2 only", "1 and 3 only", "2 and 3 only"], correct: 1, chapter: 1, page: 13, explanation: "The conclusion states that the agricultural sector 'was already saddled with surplus labour and extremely low productivity.' Statements 1 and 3 are incorrect." },
                        { question: "At the time of independence, the industrial sector was in need of:", hint: "It needed significant government support and structural changes.", options: ["Reduced public investment", "Less diversification", "Modernisation, diversification, and increased public investment", "A focus solely on consumer goods"], correct: 2, chapter: 1, page: 13, explanation: "The industrial sector was 'crying for modernisation, diversification, capacity building and increased public investment'." },
                        { question: "Which French traveller described Bengal in the seventeenth century as 'richer than Egypt'?", hint: "His name starts with a 'B'.", options: ["Marco Polo", "Ibn Battuta", "Bernier", "Vasco da Gama"], correct: 2, chapter: 1, page: 5, explanation: "The box item on page 5 quotes the French traveller, Bernier, who described seventeenth-century Bengal in glowing terms." },
                        { question: "The failure of zamindars to deposit specified revenue sums by fixed dates led to what consequence?", hint: "They risked losing their land ownership rights.", options: ["They were given financial assistance by the government.", "They were forced to invest in agricultural improvement.", "They were to lose their zamindari rights.", "The revenue amount was reduced for the next year."], correct: 2, chapter: 1, page: 6, explanation: "The terms of the revenue settlement were strict: 'dates for depositing specified sums of revenue were fixed, failing which the zamindars were to lose their rights.'" },
                        { question: "The decline of indigenous handicraft industries under British rule led to what major problems?", hint: "It affected both employment and the availability of local goods.", statements: ["Massive unemployment in India.", "A new demand in the consumer market, deprived of local goods.", "An increase in the export of Indian handicrafts."], options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], correct: 0, chapter: 1, page: 7, explanation: "Statement 3 is incorrect; exports of handicrafts declined. The decline 'created not only massive unemployment in India but also a new demand in the Indian consumer market', which was then met by British imports." },
                        { question: "More than half of India's foreign trade during the colonial period was restricted to which country?", hint: "Trade was concentrated with the colonial ruler.", options: ["China", "Ceylon (Sri Lanka)", "Persia (Iran)", "Britain"], correct: 3, chapter: 1, page: 8, explanation: "As a result of Britain's monopoly, 'more than half of India’s foreign trade was restricted to Britain'." },
                        { question: "What was a major negative consequence of the export surplus generated during the colonial era?", hint: "It led to a shortage of basic necessities within India.", options: ["It led to hyperinflation in the domestic market.", "Essential commodities like food grains and kerosene became scarce in the domestic market.", "It forced Indian producers to lower the quality of their goods.", "It resulted in heavy taxation on exports."], correct: 1, chapter: 1, page: 8, explanation: "This surplus came at a huge cost, as 'Several essential commodities—food grains, clothes, kerosene etc. — were scarcely available in the domestic market.'" },
                        { question: "What does the text suggest about the extent of poverty during the colonial period?", hint: "Precise numbers are absent, but the general condition was clear.", options: ["Poverty was completely eradicated.", "Poverty was limited to urban areas.", "The extent is difficult to specify due to a lack of reliable data, but it was extensive.", "Poverty levels were comparable to those in Britain."], correct: 2, chapter: 1, page: 10, explanation: "The text states, 'In the absence of reliable data, it is difficult to specify the extent of poverty at that time but there is no doubt that extensive poverty prevailed in India'." },
                        { question: "In states like Orissa, Rajasthan, and Punjab, what trend was observed in the occupational structure during the colonial period?", hint: "Unlike some industrializing regions, dependence on farming grew here.", options: ["A rapid shift from agriculture to manufacturing.", "A significant increase in the services sector workforce.", "An increase in the share of the workforce in agriculture.", "A balanced distribution of workforce across all three sectors."], correct: 2, chapter: 1, page: 11, explanation: "In contrast to some other regions, 'there had been an increase in the share of workforce in agriculture during the same time in states such as Orissa, Rajasthan and Punjab.'" },
                        { question: "What was a key reason for the lack of improvement in agricultural productivity?", hint: "The text points to multiple technological and infrastructural deficits.", statements: ["Low levels of technology and lack of irrigation facilities.", "Negligible use of fertilisers.", "Active discouragement of cash crops by the government."], options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], correct: 0, chapter: 1, page: 6, explanation: "Statement 3 is incorrect; the government actually encouraged cash crops for their industries. 'low levels of technology, lack of irrigation facilities and negligible use of fertilisers, all added up to aggravate the plight of the farmers'." },
                        { question: "Which of the following industries came up after the Second World War in India?", hint: "These were basic industries, not textiles or steel.", options: ["Iron and Steel", "Cotton Textiles", "Jute Mills", "Sugar, cement, paper"], correct: 3, chapter: 1, page: 7, explanation: "While textiles and steel came up earlier, 'A few other industries in the fields of sugar, cement, paper etc. came up after the Second World War.'" },
                        { question: "What was the contribution of the new industrial sector to the Gross Domestic Product (GDP) during the colonial period?", hint: "Its contribution was disproportionately low.", options: ["It was very large, forming the backbone of the economy.", "It was moderate, contributing about 30% to the GDP.", "It remained very small.", "It was equal to the contribution from the agricultural sector."], correct: 2, chapter: 1, page: 8, explanation: "The growth rate of the new industrial sector and its contribution to the Gross Domestic Product (GDP) or Gross Value Added remained very small." },
                        { question: "The famous Indian handicraft products enjoyed a worldwide market based on what?", hint: "It was about the quality of both inputs and workmanship.", options: ["Low prices and mass production", "The use of mechanised technology", "Reputation of fine quality material and high standards of craftsmanship", "British government subsidies"], correct: 2, chapter: 1, page: 4, explanation: "These products enjoyed a worldwide market 'based on the reputation of the fine quality of material used and the high standards of craftsmanship'." },
                        { question: "Which of the following was NOT a primary product exported from India during the colonial rule?", hint: "India imported manufactured goods, it did not export them.", options: ["Raw silk, cotton, wool", "Sugar, indigo, jute", "Light machinery, textiles", "Food grains"], correct: 2, chapter: 1, page: 8, explanation: "Light machinery and finished textiles were imported into India from Britain. The other items were primary products exported from India." },
                        { question: "The Suez Canal provides a direct trade route between European ports and ports located in:", hint: "It bypassed the need to go around a large continent.", statements: ["South Asia", "East Africa", "South America"], options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], correct: 0, chapter: 1, page: 9, explanation: "Statement 3 is incorrect. The canal connects to Asia and East Africa, 'doing away with the need to sail around Africa'. It does not provide a direct route to South America." },

                const view = this.state.currentView;
                if (view === 'start') {

                    this.elements.testArea.innerHTML = this.templates.quizScreen();

                    this.elements.testArea.innerHTML = this.templates.resultScreen();

                if (action && this.actions[action]) {
                    e.preventDefault();
                    this.actions[action](e.target.dataset.index || e.target);
                } else if (e.target.classList.contains('option-label')) {
                    this.actions.selectOption(parseInt(e.target.dataset.optionIndex));
                }
            }

                <div id="result-screen" class="text-center">
                    <h2 class="text-2xl sm:text-3xl font-bold mb-4 text-gray-900">Test Completed!</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-8">
                        <div class="border border-green-500 p-4 rounded-lg"><p class="text-lg font-semibold text-green-600">Correct</p><p class="text-3xl font-bold text-green-600">${correctCount}</p></div>
                        <div class="border border-red-500 p-4 rounded-lg"><p class="text-lg font-semibold text-red-600">Incorrect</p><p class="text-3xl font-bold text-red-600">${incorrectCount}</p></div>
                        <div class="border border-gray-500 p-4 rounded-lg"><p class="text-lg font-semibold text-gray-600">Unanswered</p><p class="text-3xl font-bold text-gray-600">${unansweredCount}</p></div>
                    </div>
                    <div class="bg-gray-100 p-6 rounded-lg"><p class="text-xl sm:text-2xl font-semibold text-gray-800">Final Score</p><p class="text-4xl sm:text-5xl font-bold text-gray-900 my-2">${score.toFixed(2)}</p></div>
                    <div class="mt-8 text-left">
                        <h3 class="text-xl sm:text-2xl font-semibold mb-4 text-center text-gray-800">Review Answers & Explanations</h3>
                        <div id="review-container">${reviewHtml}</div>
                    </div>
                    <div class="mt-8"><button data-action="restart" class="bg-gray-900 text-white font-bold py-3 px-8 rounded-lg hover:bg-black">Restart Test</button></div>
                </div>`;
        };

        // --- UI UPDATE FUNCTIONS ---
        Object.assign(TestApp.update, {
            // ... (previous update functions)
            timerDisplay() {
                const timerEl = document.getElementById('time-left');
                if (timerEl) {
                    const minutes = Math.floor(TestApp.state.timeRemaining / 60);
                    const seconds = TestApp.state.timeRemaining % 60;
                    timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    if (TestApp.state.timeRemaining <= 300) timerEl.parentElement.classList.add('text-red-600');
                }
            },
            markButton() { /* ... */ },
            navControls() { /* ... */ },
            paletteDisplay() { /* ... */ },
            optionsDisplay() { /* ... */ },
            questionContent() { /* ... */ },
            questionDisplay() { /* ... */ },
            questionDisplayWithTransition() { /* ... */ },
        });

        // --- FULL UPDATE FUNCTIONS ---
        TestApp.update.markButton = function() {
            const btn = document.querySelector('[data-action="mark"]');
            if (!btn) return;
            const isMarked = TestApp.state.markedForReview[TestApp.state.currentQuestionIndex];
            btn.textContent = isMarked ? 'Unmark' : 'Mark for Review';
            btn.classList.toggle('bg-yellow-500', isMarked);
            btn.classList.toggle('hover:bg-yellow-600', isMarked);
            btn.classList.toggle('bg-violet-500', !isMarked);
            btn.classList.toggle('hover:bg-violet-600', !isMarked);
        };
        TestApp.update.navControls = function() {
            document.querySelector('[data-action="prev"]').disabled = TestApp.state.currentQuestionIndex === 0;
            const isLast = TestApp.state.currentQuestionIndex === TestApp.state.questions.length - 1;
            document.querySelector('[data-action="next"]').classList.toggle('hidden', isLast);
            document.querySelector('[data-action="showSubmitConfirm"].bg-gray-900').classList.toggle('hidden', !isLast);
            document.getElementById('current-q-num').textContent = TestApp.state.currentQuestionIndex + 1;
            this.markButton();
        };
        TestApp.update.paletteDisplay = function() {
            const palette = document.getElementById('question-palette');
            if (!palette) return;
            let html = '';
            TestApp.state.questions.forEach((_, index) => {
                let btnClass = 'palette-unanswered';
                if (TestApp.state.markedForReview[index]) btnClass = TestApp.state.userAnswers[index] !== null ? 'palette-answered-marked' : 'palette-marked';
                else if (TestApp.state.userAnswers[index] !== null) btnClass = 'palette-answered';
                if (index === TestApp.state.currentQuestionIndex) btnClass = 'palette-current';
                html += `<button class="palette-btn ${btnClass}" data-action="paletteJump" data-index="${index}">${index + 1}</button>`;
            });
            palette.innerHTML = html;
        };
        TestApp.update.optionsDisplay = function() {
            const options = document.querySelectorAll('.option-label');
            options.forEach((label) => {
                const optionIndex = parseInt(label.dataset.optionIndex);
                label.classList.toggle('selected', TestApp.state.userAnswers[TestApp.state.currentQuestionIndex] === optionIndex);
            });
        };
        TestApp.update.questionContent = function() {
            const q = TestApp.state.questions[TestApp.state.currentQuestionIndex];
            let html = `<p class="text-lg font-semibold mb-${q.statements ? '2' : '4'} text-gray-900">Q${TestApp.state.currentQuestionIndex + 1}: ${q.question}</p>`;
            if (q.statements) {
                html += '<ul class="list-decimal list-inside space-y-2 mb-4">';
                q.statements.forEach(stmt => { html += `<li class="text-gray-700">${stmt}</li>`; });
                html += '</ul><p class="mb-4 font-semibold text-gray-800">Select the correct answer:</p>';
            }
            let optionsHtml = '';
            q.options.forEach((option, index) => {
                const isSelected = TestApp.state.userAnswers[TestApp.state.currentQuestionIndex] === index;
                optionsHtml += `<div><label class="option-label block border-2 border-gray-300 p-4 rounded-lg cursor-pointer ${isSelected ? 'selected' : ''}" data-option-index="${index}">${option}</label></div>`;
            });
            const wrapper = document.getElementById('question-content-wrapper');
            if (wrapper) wrapper.innerHTML = `${html}<div class="space-y-3">${optionsHtml}</div><div id="hint-box" class="hint-box bg-yellow-50 border border-yellow-200 rounded-lg text-yellow-800">${q.hint}</div>`;
        };
        TestApp.update.questionDisplay = function() {
            this.questionContent();
            this.navControls();
            this.paletteDisplay();
        };
        TestApp.update.questionDisplayWithTransition = function() {
            const wrapper = document.getElementById('question-content-wrapper');
            if (wrapper) {
                wrapper.style.opacity = '0';
                setTimeout(() => {
                    this.questionDisplay();
                    wrapper.style.opacity = '1';
                }, 150);
            }
        };


        // --- ACTIONS ---
        Object.assign(TestApp.actions, {
            start() {
                TestApp.state.currentView = 'quiz';
                TestApp.state.userAnswers = new Array(TestApp.state.questions.length).fill(null);
                TestApp.state.markedForReview = new Array(TestApp.state.questions.length).fill(false);
                TestApp.state.timeRemaining = 3600;
                TestApp.render();
                TestApp.startTimer();
            },
            selectOption(index) {
                TestApp.state.userAnswers[TestApp.state.currentQuestionIndex] = index;
                TestApp.update.optionsDisplay();
                TestApp.update.paletteDisplay();
            },
            navigate(direction) {
                const newIndex = TestApp.state.currentQuestionIndex + parseInt(direction);
                if (newIndex >= 0 && newIndex < TestApp.state.questions.length) {
                    TestApp.state.currentQuestionIndex = newIndex;
                    TestApp.update.questionDisplayWithTransition();
                }
            },
            paletteJump(index) {
                TestApp.state.currentQuestionIndex = parseInt(index);
                TestApp.update.questionDisplayWithTransition();
            },
            mark() {
                const index = TestApp.state.currentQuestionIndex;
                TestApp.state.markedForReview[index] = !TestApp.state.markedForReview[index];
                TestApp.update.markButton();
                TestApp.update.paletteDisplay();
            },
            submit() {
                clearInterval(TestApp.state.timerInterval);
                TestApp.state.currentView = 'result';
                TestApp.render();
            },
            restart() {
                TestApp.state.currentView = 'start';
                TestApp.render();
            },
            toggleExplanation(button) {
                const explanationDiv = button.nextElementSibling;
                explanationDiv.classList.toggle('show');
                button.textContent = explanationDiv.classList.contains('show') ? 'Hide Explanation' : 'Show Explanation';
            },
            toggleHint(button) {
                const hintBox = document.getElementById('hint-box');
                if (hintBox) {
                    hintBox.classList.toggle('show');
                    button.textContent = hintBox.classList.contains('show') ? 'Hide Hint' : 'Show Hint';
                }
            },
            showSubmitConfirm() {
                TestApp.elements.confirmModal.classList.remove('hidden');
            },
            prev() { this.navigate(-1); },
            next() { this.navigate(1); }
        });

        // --- TIMER ---
        TestApp.startTimer = function() {
            clearInterval(this.state.timerInterval);
            this.state.timerInterval = setInterval(() => {
                this.state.timeRemaining--;
                this.update.timerDisplay();
                if (this.state.timeRemaining <= 0) this.actions.submit();
            }, 1000);
        };

        TestApp.init();
        });
    </script>
</body>
</html>
